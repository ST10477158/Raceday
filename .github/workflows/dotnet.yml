name: RaceDay CI - Part 2

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore Raceday.sln
    - name: Build
      run: dotnet build Raceday.sln --no-restore
    - name: Test
      run: dotnet test Raceday.sln --no-build --verbosity normal
