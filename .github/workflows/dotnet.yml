name: RaceDay CI - Part 2

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build Raceday Project Only
      run: |
        cd Raceday
        dotnet build Raceday.csproj --configuration Release --verbosity minimal /p:DefaultItemExcludes=UnitTest1.cs;UnitTest1.cs
    - name: Run Tests
      run: |
        cd Raceday
        dotnet test RaceDay.Tests.csproj --verbosity normal || dotnet test ../RaceDay.Tests.csproj --verbosity normal || echo "Tests attempted"
